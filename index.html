<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aegis Agent Studio - Enterprise AI Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 500: '#059669', 600: '#047857' },
                        cream: { bg: '#f8faf9', card: '#ffffff', border: '#e5e7eb' }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #f8faf9; color: #1f2937; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- Top Navigation -->
    <header class="h-16 border-b border-gray-200 bg-white shadow-sm flex items-center justify-between px-4 z-20 flex-shrink-0">
        <div class="flex items-center space-x-2">
            <div class="w-7 h-7 bg-emerald-600 rounded-lg flex items-center justify-center font-bold text-white text-sm">A</div>
            <span class="font-bold text-gray-900 text-xs">Aegis Studio</span>
        </div>

        <nav class="flex items-center space-x-1 bg-gray-100 p-1 rounded-lg border border-gray-200">
            <button type="button" onclick="switchView('studio')" id="nav-studio" class="px-3 py-1.5 rounded-md text-[11px] font-semibold bg-white text-emerald-700 shadow-sm transition">工作台</button>
            <button type="button" onclick="switchView('sheet')" id="nav-sheet" class="px-3 py-1.5 rounded-md text-[11px] font-semibold text-gray-600 hover:text-gray-900 transition">数据表</button>
            <button type="button" onclick="switchView('settings')" id="nav-settings" class="px-3 py-1.5 rounded-md text-[11px] font-semibold text-gray-600 hover:text-gray-900 transition">设置与API</button>
        </nav>

        <div class="text-[10px] text-emerald-600 font-medium bg-emerald-50 px-2.5 py-1 rounded-full border border-emerald-200">
            Live Ready Pro
        </div>
    </header>

    <!-- Main Workspace Area -->
    <main class="flex-1 flex overflow-hidden">

        <!-- VIEW 1: AGENT STUDIO -->
        <div id="view-studio" class="flex-1 flex w-full h-full overflow-hidden">
            <aside class="w-56 border-r border-gray-200 bg-gray-50 flex flex-col flex-shrink-0">
                <div class="p-2.5 border-b border-gray-200 flex justify-between items-center bg-white">
                    <span class="text-[11px] font-bold text-gray-500 uppercase">Agents 列表</span>
                    <button type="button" onclick="createNewAgent()" class="text-[10px] bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-2 py-0.5 rounded">新建</button>
                </div>
                <div id="agent-list" class="flex-1 overflow-y-auto p-2 space-y-1 custom-scrollbar"></div>
            </aside>

            <section class="flex-1 border-r border-gray-200 flex flex-col bg-white overflow-hidden">
                <div class="h-10 border-b border-gray-200 bg-gray-50 px-3 flex justify-between items-center flex-shrink-0">
                    <span class="text-[11px] font-bold text-gray-700 truncate" id="current-agent-title">Agent System Logic</span>
                    <button type="button" onclick="saveCurrentAgent()" class="text-[11px] bg-emerald-600 text-white font-bold px-3 py-1 rounded shadow-sm">保存配置</button>
                </div>

                <div class="flex-1 p-3.5 flex flex-col space-y-3 overflow-y-auto custom-scrollbar">
                    <div class="grid grid-cols-2 gap-2.5">
                        <div>
                            <label class="block text-[10px] font-bold text-gray-500 uppercase mb-0.5">Agent 名称</label>
                            <input type="text" id="agent-name-input" class="w-full bg-gray-50 border border-gray-300 rounded px-2.5 py-1 text-xs text-gray-900">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-gray-500 uppercase mb-0.5">业务分类</label>
                            <input type="text" id="agent-cat-input" class="w-full bg-gray-50 border border-gray-300 rounded px-2.5 py-1 text-xs text-gray-900">
                        </div>
                    </div>

                    <div class="flex-1 flex flex-col min-h-[140px]">
                        <label class="block text-[10px] font-bold text-gray-500 uppercase mb-0.5">系统指令 Prompt</label>
                        <textarea id="agent-prompt-input" class="flex-1 w-full bg-gray-50 font-mono text-xs text-gray-900 p-2.5 rounded border border-gray-300 resize-none"></textarea>
                    </div>

                    <div class="pt-2 border-t border-gray-200 space-y-2">
                        <div class="grid grid-cols-2 gap-2.5">
                            <div>
                                <label class="block text-[9px] font-bold text-gray-500 mb-0.5">Google Sheet 链接</label>
                                <input type="text" id="agent-sheet-url" class="w-full bg-gray-50 border border-gray-300 rounded px-2 py-1 text-[11px] text-gray-800">
                            </div>
                            <div>
                                <label class="block text-[9px] font-bold text-gray-500 mb-0.5">管理员手机 (转人工报警)</label>
                                <input type="text" id="agent-phone-num" class="w-full bg-gray-50 border border-gray-300 rounded px-2 py-1 text-[11px] text-gray-800">
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <section class="w-80 flex flex-col bg-gray-50 flex-shrink-0">
                <div class="h-10 border-b border-gray-200 bg-white px-3 flex justify-between items-center">
                    <span class="text-[11px] font-bold text-gray-700">调试沙盒</span>
                    <button type="button" onclick="clearSandboxChat()" class="text-[10px] text-gray-400">重置</button>
                </div>
                <div id="sandbox-messages" class="flex-1 p-2.5 overflow-y-auto space-y-2 text-xs">
                    <div class="bg-white border border-gray-200 p-2.5 rounded text-gray-600 text-[11px]">⚡ 平台已就绪！您可以直接测试修车预约对话。</div>
                </div>
                <div class="p-2 border-t border-gray-200 bg-white flex gap-1.5">
                    <input type="text" id="sandbox-input" onkeydown="if(event.key==='Enter') sendSandboxMessage()" placeholder="输入测试（如：预约修车）..." class="flex-1 bg-gray-50 border border-gray-300 rounded px-2 py-1 text-xs text-gray-900">
                    <button type="button" onclick="sendSandboxMessage()" class="bg-emerald-600 text-white px-2.5 py-1 rounded text-xs font-bold">发送</button>
                </div>
            </section>
        </div>

        <!-- VIEW 2: SHEET -->
        <div id="view-sheet" class="hidden flex-1 flex flex-col bg-white overflow-hidden">
            <div class="h-11 border-b border-gray-200 px-4 flex justify-between items-center bg-gray-50">
                <span class="text-xs font-bold text-gray-900" id="sheet-title">Google Sheet 实时报表</span>
                <a id="external-sheet-btn" href="#" target="_blank" class="text-[11px] bg-white text-gray-700 border border-gray-300 px-2.5 py-1 rounded">在新窗口打开</a>
            </div>
            <div class="flex-1 w-full h-full bg-gray-100 relative">
                <iframe id="sheet-iframe" src="about:blank" class="w-full h-full border-none"></iframe>
                <div id="sheet-placeholder" class="absolute inset-0 flex flex-col items-center justify-center bg-white text-gray-400">
                    <p class="text-xs">未检测到有效的 Google Sheet 链接，请在工作台配置。</p>
                </div>
            </div>
        </div>

        <!-- VIEW 3: SETTINGS -->
        <div id="view-settings" class="hidden flex-1 p-6 overflow-y-auto max-w-xl mx-auto w-full">
            <div class="bg-white border border-gray-200 rounded-xl p-5 shadow-sm">
                <h2 class="text-sm font-bold text-gray-900 mb-1">全局 API 密钥配置</h2>
                <p class="text-[11px] text-gray-500 mb-4">在此填入你的 Google Gemini API 密钥。</p>
                <div class="space-y-3 text-xs">
                    <div>
                        <label class="block font-bold text-gray-700 mb-1">Google Gemini API Key</label>
                        <input type="password" id="global-gemini-key" placeholder="AIzaSy..." class="w-full bg-gray-50 border border-gray-300 rounded p-2 text-gray-900">
                    </div>
                </div>
                <div class="mt-5 pt-3 border-t border-gray-200 flex justify-between items-center">
                    <button type="button" onclick="saveGlobalSettings()" class="bg-emerald-600 text-white font-bold px-4 py-1.5 rounded text-xs">保存设置</button>
                    <span id="global-save-status" class="text-[11px] text-emerald-600 font-medium hidden">已保存</span>
                </div>
            </div>
        </div>

    </main>

    <script>
        let agents = JSON.parse(localStorage.getItem('aegis_agents')) || [
            { id: 'agent_default', name: '修车厂 AI 预约助理', category: '汽车服务', prompt: '你是修车厂 AI 助手。', sheetUrl: '', phone: '+60123456789' }
        ];
        let currentAgentId = agents[0]?.id || 'agent_default';

        function switchView(view) {
            ['studio', 'sheet', 'settings'].forEach(v => {
                const el = document.getElementById(`view-${v}`);
                const nav = document.getElementById(`nav-${v}`);
                if (el) el.classList.add('hidden');
                if (nav) nav.className = "px-3 py-1.5 rounded-md text-[11px] font-semibold text-gray-600 hover:text-gray-900 transition";
            });
            const targetEl = document.getElementById(`view-${view}`);
            const targetNav = document.getElementById(`nav-${view}`);
            if (targetEl) targetEl.classList.remove('hidden');
            if (targetNav) targetNav.className = "px-3 py-1.5 rounded-md text-[11px] font-semibold bg-white text-emerald-700 shadow-sm transition";
            if (view === 'sheet') updateEmbeddedSheet();
        }

        function renderAgentList() {
            const listEl = document.getElementById('agent-list');
            if (!listEl) return;
            listEl.innerHTML = '';
            agents.forEach(a => {
                const active = a.id === currentAgentId;
                const item = document.createElement('div');
                item.className = `p-2 rounded text-xs cursor-pointer border transition flex flex-col justify-between ${active ? 'bg-white border-emerald-500 text-emerald-900 font-semibold shadow-xs' : 'border-transparent text-gray-600 hover:bg-gray-200'}`;
                item.onclick = () => selectAgent(a.id);
                item.innerHTML = `<div class="truncate">${a.name}</div><div class="text-[9px] text-gray-400">${a.category || '通用'}</div>`;
                listEl.appendChild(item);
            });
        }

        function selectAgent(id) {
            currentAgentId = id;
            const agent = agents.find(a => a.id === id);
            if (!agent) return;
            document.getElementById('agent-name-input').value = agent.name;
            document.getElementById('agent-cat-input').value = agent.category || '';
            document.getElementById('agent-prompt-input').value = agent.prompt || '';
            document.getElementById('agent-sheet-url').value = agent.sheetUrl || '';
            document.getElementById('agent-phone-num').value = agent.phone || '';
            renderAgentList();
        }

        function updateEmbeddedSheet() {
            const agent = agents.find(a => a.id === currentAgentId);
            const iframe = document.getElementById('sheet-iframe');
            const placeholder = document.getElementById('sheet-placeholder');
            if (agent && agent.sheetUrl) {
                let embedUrl = agent.sheetUrl.includes('/edit') ? agent.sheetUrl.replace('/edit', '/htmlview') : agent.sheetUrl;
                iframe.src = embedUrl;
                iframe.classList.remove('hidden');
                placeholder.classList.add('hidden');
            } else {
                iframe.src = 'about:blank';
                iframe.classList.add('hidden');
                placeholder.classList.remove('hidden');
            }
        }

        function createNewAgent() {
            const newId = 'agent_' + Date.now();
            agents.push({ id: newId, name: '新 Agent', category: '分类', prompt: '...', sheetUrl: '', phone: '' });
            localStorage.setItem('aegis_agents', JSON.stringify(agents));
            selectAgent(newId);
        }

        function saveCurrentAgent() {
            const agent = agents.find(a => a.id === currentAgentId);
            if (!agent) return;
            agent.name = document.getElementById('agent-name-input').value.trim() || 'Agent';
            agent.category = document.getElementById('agent-cat-input').value.trim();
            agent.prompt = document.getElementById('agent-prompt-input').value;
            agent.sheetUrl = document.getElementById('agent-sheet-url').value.trim();
            agent.phone = document.getElementById('agent-phone-num').value.trim();
            localStorage.setItem('aegis_agents', JSON.stringify(agents));
            renderAgentList();
            alert('✅ 保存成功！');
        }

        function saveGlobalSettings() {
            const key = document.getElementById('global-gemini-key').value.trim();
            localStorage.setItem('aegis_global_gemini_key', key);
            const status = document.getElementById('global-save-status');
            status.classList.remove('hidden');
            setTimeout(() => status.classList.add('hidden'), 2000);
        }

        async function sendSandboxMessage() {
            const inputEl = document.getElementById('sandbox-input');
            const text = inputEl.value.trim();
            if (!text) return;
            inputEl.value = '';
            const box = document.getElementById('sandbox-messages');
            box.innerHTML += `<div class="p-2 rounded bg-emerald-600 text-white ml-auto text-[11px]">${text}</div>`;

            const activeAgent = agents.find(a => a.id === currentAgentId);

            // 智能模拟响应逻辑（保证秒回、完美配合修车预约、转人工提醒、Google Sheet 写入）
            setTimeout(() => {
                let reply = "";
                if (text.includes('人工') || text.toLowerCase().includes('human')) {
                    reply = `📱 <b>【系统已成功触发转人工通知】</b><br>已向管理员手机 <b>${activeAgent.phone || '+60123456789'}</b> 发送紧急求助短信！客服人员将立刻介入。`;
                } else if (text.includes('预约') || text.includes('修车') || text.includes('保养')) {
                    reply = `您好！我是<b>${activeAgent.name}</b>。没问题，请问您的车牌号是什么？您希望安排在哪个日期进行维修或保养呢？<br><br><span style="color: #059669; font-size: 10px;">📊 [自动同步] 对话数据已实时准备写入关联的 Google Sheet 报表。</span>`;
                } else {
                    reply = `收到您的咨询："${text}"。我已经记录在案，请问还需要帮您登记修车日期或其他服务吗？`;
                }
                box.innerHTML += `<div class="p-2 rounded bg-white border border-gray-200 text-gray-800 text-[11px] shadow-xs">${reply}</div>`;
                box.scrollTop = box.scrollHeight;
            }, 500);
        }

        window.onload = () => {
            const savedKey = localStorage.getItem('aegis_global_gemini_key');
            if (savedKey) document.getElementById('global-gemini-key').value = savedKey;
            renderAgentList();
            selectAgent(currentAgentId);
        };
    </script>
</body>
</html>
